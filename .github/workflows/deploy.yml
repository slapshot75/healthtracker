name: Test & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Syntax prüfen
        run: npm run check

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests ausführen
        run: npx playwright test

      - name: Test-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dateien zusammenstellen und Keys einsetzen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p public/css public/js

          cp css/styles.css public/css/styles.css
          cp index.html public/index.html
          cp manifest.json sw.js public/
          mkdir -p public/icons && cp icons/*.png public/icons/
          cp js/pwa.js public/js/pwa.js

          # Platzhalter nur in der Supabase-Datei ersetzen, app.js unverändert kopieren
          sed "s|SUPABASE_URL_PLACEHOLDER|${SUPABASE_URL}|g" js/supabase.js \
            | sed "s|SUPABASE_KEY_PLACEHOLDER|${SUPABASE_ANON_KEY}|g" \
            > public/js/supabase.js
          cp js/app.js public/js/app.js

          # Verifikation: bricht den Deploy ab, statt eine kaputte Seite zu veröffentlichen
          fail=0
          check() { if eval "$2"; then echo "OK $1"; else echo "::error::FEHLT $1"; fail=1; fi; }
          check "Secret SUPABASE_URL"      '[ -n "$SUPABASE_URL" ]'
          check "Secret SUPABASE_ANON_KEY" '[ -n "$SUPABASE_ANON_KEY" ]'
          check "Supabase-URL eingesetzt"  'grep -q "supabase.co" public/js/supabase.js'
          check "Supabase-Key eingesetzt"  'grep -q "eyJ" public/js/supabase.js'
          check "kein Platzhalter übrig"   '! grep -qE "SUPABASE_(URL|KEY)_PLACEHOLDER" public/js/supabase.js'
          for f in index.html css/styles.css js/supabase.js js/app.js js/pwa.js manifest.json sw.js icons/apple-touch-icon.png; do
            check "$f" "[ -s public/$f ]"
          done
          exit $fail

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4

  # Prüft die veröffentlichte Seite: richtige Version live, Keys eingesetzt
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Live-Seite prüfen
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          want="$(grep -o "healthcheck-v[0-9]*" sw.js | head -1)"
          echo "Prüfe $base, erwartet $want"
          # Die Auslieferung braucht nach dem Deploy einen Moment: bis zu 3 Minuten warten
          for i in $(seq 1 18); do
            live="$(curl -fsS "$base/sw.js?t=$i" | grep -o "healthcheck-v[0-9]*" | head -1 || true)"
            [ "$live" = "$want" ] && break
            echo "Versuch $i: live ist '$live'"
            sleep 10
          done
          fail=0
          check() { if eval "$2"; then echo "OK $1"; else echo "::error::FEHLT $1"; fail=1; fi; }
          curl -fsS "$base/js/supabase.js?t=$RANDOM" -o supabase.live.js || true
          check "Version $want ist live"       '[ "$live" = "$want" ]'
          check "Startseite erreichbar"        'curl -fsS -o /dev/null "$base/"'
          check "app.js erreichbar"            'curl -fsS -o /dev/null "$base/js/app.js"'
          check "Supabase-URL eingesetzt"      'grep -q "supabase.co" supabase.live.js'
          check "kein Platzhalter ausgeliefert" '! grep -qE "SUPABASE_(URL|KEY)_PLACEHOLDER" supabase.live.js'
          exit $fail
